name: Upgrade Next security patch

on:
  push:
    branches: [agent/security-next-patch]
    paths:
      - .github/workflows/upgrade-next-security.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-next-patch
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install patched Maintenance LTS versions
        run: npm install --save-exact next@15.5.22 react@19.1.7 react-dom@19.1.7
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Verify application
        run: npm run check
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          CLERK_SECRET_KEY: sk_test_ci_placeholder
      - name: Commit lockfile update
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m "Upgrade Next.js and React security patches"
          git push origin HEAD:agent/security-next-patch
