name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          CLERK_SECRET_KEY: sk_test_ci_placeholder

  worker:
    name: Cloudflare worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run check

  smart-pdf-runtime:
    name: Smart PDF llama.cpp runtime
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/living-doc-phase-9'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 4.0.10 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install 4.0.10
          /tmp/emsdk/emsdk activate 4.0.10
      - name: Build pinned llama.cpp as JavaScript-only runtime
        shell: bash
        run: |
          set -euo pipefail
          source /tmp/emsdk/emsdk_env.sh
          git clone --depth 1 --branch b9637 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          emcmake cmake -S /tmp/llama.cpp -B /tmp/llama-build \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_EXECUTABLE_SUFFIX=.js \
            -DLLAMA_CURL=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-Oz -sWASM=0 -sSINGLE_FILE=1 -sINVOKE_RUN=0 -sEXIT_RUNTIME=0 -sALLOW_MEMORY_GROWTH=1 -sMAXIMUM_MEMORY=1073741824 -sENVIRONMENT=shell -sFORCE_FILESYSTEM=1 -sEXPORTED_FUNCTIONS=_main -sEXPORTED_RUNTIME_METHODS=FS,callMain"
          cmake --build /tmp/llama-build --target llama-simple -j2
          mkdir -p smart-runtime
          cp /tmp/llama-build/bin/llama-simple.js smart-runtime/llama-runtime.js
          test -s smart-runtime/llama-runtime.js
          if find /tmp/llama-build -name '*.wasm' -size +0c | grep -q .; then
            echo 'Unexpected WebAssembly output.' >&2
            exit 1
          fi
          RUNTIME_SHA=$(sha256sum smart-runtime/llama-runtime.js | cut -d' ' -f1)
          RUNTIME_BYTES=$(wc -c < smart-runtime/llama-runtime.js | tr -d ' ')
          cat > smart-runtime/runtime-manifest.json <<EOF
          {"runtime":"llama.cpp-asmjs","llamaCppTag":"b9637","llamaCppCommit":"aedb2a5","llamaCppLicense":"MIT","emscripten":"4.0.10","sha256":"$RUNTIME_SHA","bytes":$RUNTIME_BYTES,"wasm":false}
          EOF
          grep -q "callMain" smart-runtime/llama-runtime.js
          test "$RUNTIME_BYTES" -lt 50000000
      - uses: actions/upload-artifact@v4
        with:
          name: smart-pdf-runtime
          path: smart-runtime
          if-no-files-found: error
