name: Security lock refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'agent/security-next-patch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/security-next-patch
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh package lock
        run: npm install --package-lock-only
      - name: Install exact lock
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Verify application
        run: npm run check
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          CLERK_SECRET_KEY: sk_test_ci_placeholder
      - name: Commit refreshed lock when needed
        run: |
          set -euo pipefail
          if git diff --quiet package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git commit -m 'Refresh dependency lock for security patches'
          git push origin HEAD:agent/security-next-patch
